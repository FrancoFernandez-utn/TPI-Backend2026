# Despliegue completo del MVP. Solo el API Gateway (8080) y Keycloak (8081) publican puertos:
# PostgreSQL y los microservicios quedan en la red interna (trusted zone).
#
#   docker compose up -d --build
#
# Variables opcionales en un archivo .env (ver .env.example).

name: agrodrones

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrodrones
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CAMPOS_DB_PASSWORD: ${CAMPOS_DB_PASSWORD:-campos_pass}
      MISIONES_DB_PASSWORD: ${MISIONES_DB_PASSWORD:-misiones_pass}
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d agrodrones"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interna]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # URL publica fija: los tokens siempre llevan este emisor, aunque los servicios
      # hablen con Keycloak por la red interna (keycloak:8080).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-agrodrones.json:/opt/keycloak/data/import/realm-agrodrones.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [interna]

  ms-campos:
    build:
      context: .
      dockerfile: ms-campos/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agrodrones
      DB_USER: campos_user
      DB_PASSWORD: ${CAMPOS_DB_PASSWORD:-campos_pass}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/agrodrones/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/agrodrones
      SPRING_FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [interna]

  ms-misiones:
    build:
      context: .
      dockerfile: ms-misiones/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agrodrones
      DB_USER: misiones_user
      DB_PASSWORD: ${MISIONES_DB_PASSWORD:-misiones_pass}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/agrodrones/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/agrodrones
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/agrodrones/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: ms-misiones
      KEYCLOAK_CLIENT_SECRET: ${MS_MISIONES_CLIENT_SECRET:-ms-misiones-secret}
      MS_CAMPOS_URL: http://ms-campos:8082
      # openmeteo: pronostico real (requiere Internet). simulado: escenarios fijos para la demo.
      CLIMA_PROVEEDOR: ${CLIMA_PROVEEDOR:-openmeteo}
      SPRING_FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [interna]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      MS_CAMPOS_URL: http://ms-campos:8082
      MS_MISIONES_URL: http://ms-misiones:8083
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/agrodrones/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/agrodrones
    ports:
      - "8080:8080"
    depends_on:
      ms-campos:
        condition: service_healthy
      ms-misiones:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [interna]

networks:
  interna:

volumes:
  postgres-datos:
